<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M5 Screen Link</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>M5 Screen Link</h1>
      <p>共有する画面またはウィンドウを選び、CardputerとStackChanへ静止画列として送ります。音声は送信しません。</p>

      <label>
        接続トークン
        <input id="token" type="password" autocomplete="off" />
      </label>

      <fieldset>
        <legend>送信先</legend>
        <label><input id="cardputer" type="checkbox" checked /> Cardputer（240×135）</label>
        <label><input id="stackchan" type="checkbox" checked /> StackChan（320×240）</label>
      </fieldset>

      <div class="settings">
        <label>FPS <input id="fps" type="number" min="1" max="15" value="8" /></label>
        <label>JPEG品質 <input id="quality" type="number" min="30" max="90" value="60" /></label>
      </div>

      <div class="actions">
        <button id="start">画面共有を開始</button>
        <button id="stop" disabled>停止</button>
      </div>

      <p id="status" role="status">停止中</p>
      <video id="source" muted playsinline></video>
      <canvas id="cardputer-canvas" width="240" height="135"></canvas>
      <canvas id="stackchan-canvas" width="320" height="240"></canvas>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
