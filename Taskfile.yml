version: "3.48"

tasks:
  default:
    desc: 利用できるtaskを表示する
    cmds:
      - task --list
    silent: true

  check:
    desc: 静的検査、秘密情報監査、単体テストを実行する
    cmds:
      - ./scripts/check.sh

  docs:build:
    desc: my-m5docsを厳格ビルドする
    aliases: [docs]
    cmds:
      - mkdocs build --strict

  target:show:
    desc: 実機ごとの.envプロファイルの現在状態を表示する（StackChan/Cardputerを分離運用）
    aliases: [target]
    cmds:
      - ./scripts/select-target.sh show

  target:use:
    desc: "対象プロファイルへ切替（例: task target:use NAME=cardputer）。切替前に現行.envを自動保存"
    requires:
      vars: [NAME]
    env:
      TASK_NAME: "{{.NAME}}"
    cmds:
      - ./scripts/select-target.sh "$TASK_NAME"

  target:cardputer:
    desc: アクティブ.envをCardputer(.env.cardputer)へ切替える
    cmds:
      - ./scripts/select-target.sh cardputer

  target:stackchan:
    desc: アクティブ.envをStackChan(.env.stackchan)へ切替える
    cmds:
      - ./scripts/select-target.sh stackchan

  device:detect:
    desc: USB属性だけを読み、対応デバイス候補を表示する
    aliases: [detect]
    cmds:
      - ./scripts/detect-device.sh

  device:init:
    desc: 実機固有値を非公開.envへ保存する
    aliases: [init]
    cmds:
      - ./scripts/init-env.sh

  device:list:
    desc: 対応製品を一覧表示する
    aliases: [list]
    cmds:
      - ./scripts/select-board.sh list

  device:select:
    desc: "対象製品を選ぶ（例: task device:select MODEL=cores3）"
    aliases: [select]
    requires:
      vars: [MODEL]
    env:
      TASK_MODEL: "{{.MODEL}}"
    cmds:
      - ./scripts/select-board.sh "$TASK_MODEL"

  device:grant-port:
    desc: 選択済みUSB portへ一時的な利用権限を付ける
    aliases: [grant, device:grant]
    cmds:
      - ./scripts/grant-port-access.sh

  device:grant:persist:
    desc: "安全案内のみ。永続ACL(udevルール)導入は device:grant:persist:run"
    cmds:
      - ./scripts/install-udev-rule.sh

  device:grant:persist:run:
    desc: "実行: udev永続ルールを配置し以後 task grant を不要にする（pkexec）"
    cmds:
      - ./scripts/install-udev-rule.sh --install

  device:backup:
    desc: "安全案内のみ。実行は scripts/backup-flash.sh --allow-reset"
    aliases: [backup]
    cmds:
      - ./scripts/backup-flash.sh

  device:backup:run:
    desc: "実行: 全Flashバックアップ（--allow-reset）。実機をリセットします。"
    cmds:
      - ./scripts/backup-flash.sh --allow-reset

  device:backup:usbjtag:run:
    desc: "実行: 全Flashバックアップ（単発--no-stub読出し）。ESP32-S3のUSB-Serial-JTAGで分割読出しが不安定な時に。"
    env:
      M5_BACKUP_READ_MODE: single-nostub
    cmds:
      - ./scripts/backup-flash.sh --allow-reset

  device:upload:
    desc: "安全案内のみ。実行は scripts/upload.sh --allow-flash"
    aliases: [upload]
    cmds:
      - ./scripts/upload.sh

  device:monitor:
    desc: "安全案内のみ。実行は scripts/monitor.sh --allow-reset"
    aliases: [monitor]
    cmds:
      - ./scripts/monitor.sh

  device:restore:
    desc: "安全案内のみ。実行は scripts/restore-flash.sh --allow-flash <flash.bin>"
    aliases: [restore]
    cmds:
      - ./scripts/restore-flash.sh

  arduino:setup:
    desc: Arduinoの固定版依存を.localへ導入する
    aliases: [setup]
    cmds:
      - ./scripts/setup.sh

  arduino:build:
    desc: 選択製品向けの確認スケッチをビルドする
    aliases: [build]
    cmds:
      - ./scripts/build.sh

  arduino:matrix:
    desc: 代表製品向けの確認スケッチを順番にビルドする
    aliases: [matrix]
    cmds:
      - ./scripts/build-matrix.sh

  arduino:ci:
    desc: "CI対象を一つビルドする（例: task arduino:ci TARGET=m5stack:esp32:m5stack_cores3）"
    requires:
      vars: [TARGET]
    env:
      TASK_TARGET: "{{.TARGET}}"
    cmds:
      - ./scripts/build-ci-target.sh "$TASK_TARGET"

  cardputer:screen-link:build:
    desc: Cardputer画面リンクclientをビルドする（Flashなし）
    aliases: [build-cardputer-screen-link]
    cmds:
      - ./cardputer/screen-link/build.sh

  cardputer:fw:list:
    desc: Cardputer向けコミュニティFW(Launcher/Bruce/GameStation)の固定版カタログを一覧表示する
    cmds:
      - ./scripts/fetch-cardputer-firmware.sh --list

  cardputer:fw:fetch:
    desc: "Cardputer向けFWを固定版で取得しsha検証する（例: task cardputer:fw:fetch FW=bruce で単体、無指定で全件）"
    vars:
      FW: '{{.FW | default ""}}'
    env:
      TASK_FW: "{{.FW}}"
    cmds:
      - ./scripts/fetch-cardputer-firmware.sh "$TASK_FW"

  cardputer:fw:flash:
    desc: "安全案内のみ。実行は scripts/flash-cardputer-firmware.sh --allow-flash <launcher|bruce|gamestation>"
    cmds:
      - ./scripts/flash-cardputer-firmware.sh

  cardputer:fw:flash:run:
    desc: "実行: Cardputerへ固定版FWを0x0書込み（要 cardputer選択/バインド/バックアップmarker/ポート権限）。例: task cardputer:fw:flash:run FW=launcher"
    requires:
      vars: [FW]
    env:
      TASK_FW: "{{.FW}}"
    cmds:
      - ./scripts/flash-cardputer-firmware.sh --allow-flash "$TASK_FW"

  cardputer:sd:provision:
    desc: "安全案内のみ。M5Launcher公開SDをFAT32初期化しFW binを配置（実行は :run）"
    cmds:
      - ./scripts/provision-cardputer-sd.sh

  cardputer:sd:provision:run:
    desc: "実行: Launcher公開SDをFAT32初期化し取得済みFW binを一括配置（pkexec・SD全消去）"
    cmds:
      - ./scripts/provision-cardputer-sd.sh --allow-format

  stackchan:fetch:
    desc: StackChan上流ソースを固定commitで取得する
    aliases: [fetch-stackchan]
    cmds:
      - ./scripts/fetch-stackchan.sh

  stackchan:factory:setup:
    desc: 固定版ESP-IDFとStackChan上流ソースを導入する
    aliases: [setup-stackchan]
    cmds:
      - ./scripts/setup-stackchan-factory.sh

  stackchan:factory:build:
    desc: StackChan公式ファームを日本語設定でビルドする（Flashなし）
    aliases: [build-stackchan]
    cmds:
      - ./scripts/build-stackchan-factory.sh

  stackchan:community:install:
    desc: "安全案内のみ。実行は scripts/install-community-stackchan.sh --allow-flash --replace-factory-firmware"
    aliases: [install-community]
    cmds:
      - ./scripts/install-community-stackchan.sh

  stackchan:screen-link:build:
    desc: StackChan画面リンク版をビルドする（Flashなし）
    aliases: [build-stackchan-screen-link]
    cmds:
      - ./stackchan/screen-link/build.sh

  stackchan:screen-link:ci:
    desc: 公開用の仮値でStackChan画面リンク版を検証する（Flashなし）
    cmds:
      - ./stackchan/screen-link/build.sh --ci

  stackchan:build:
    desc: StackChan音声ファームを実キーでビルドする（Flashなし）
    cmds:
      - ./stackchan/voice/build.sh

  stackchan:build:ci:
    desc: 公開用の例ヘッダでコンパイル可否を確認する（Flashなし）
    cmds:
      - ./stackchan/voice/build.sh --ci

  stackchan:flash:
    desc: "安全案内のみ。実行は stackchan/voice/flash.sh --allow-flash --replace-factory-firmware"
    cmds:
      - ./stackchan/voice/flash.sh

  stackchan:flash:run:
    desc: "実行: StackChanへ書き込む（全Flashバックアップmarkerが必要）。"
    cmds:
      - ./stackchan/voice/flash.sh --allow-flash --replace-factory-firmware

  stackchan:flash:i:
    desc: "対話実行: 確認してから書き込む（バックアップ不可時。復旧はM5Burner前提）。"
    cmds:
      - ./stackchan/voice/flash.sh --interactive --allow-flash --replace-factory-firmware --official-recovery-ready

  stackchan:local:up:
    desc: PC側の完全ローカルAI（Ollama + faster-whisperサーバ）を起動する
    cmds:
      - ./pc/local-ai/up.sh

  stackchan:local:status:
    desc: 完全ローカルAI（Ollama/STT）の稼働状態を確認する
    cmds:
      - ./pc/local-ai/status.sh

  stackchan:local:dev:
    desc: 開発モード。ローカルAI(STT+Ollama)をフォアグラウンド(ログ表示)で起動（Ctrl-Cで停止）
    cmds:
      - ./pc/local-ai/dev.sh

  stackchan:local:host:
    desc: このPCのLAN IPをLOCAL_HOSTとして取り込む（実行前に確認）
    cmds:
      - ./scripts/set-local-host.sh

  stackchan:chat:
    desc: host側でStackChanとテキスト会話する（ローカルLLM経由）
    cmds:
      - python pc/stackchan-sim/sim.py --chat

  stackchan:sim:
    desc: 実機なしでStackChanの顔ミニ窓を出してチャットする（シミュレータ・e2e用）
    cmds:
      - python pc/stackchan-sim/sim.py --gui

  wifi:capture:
    desc: いまPCが使用中のWi-Fiを対象ファームの.envへ取り込む（実行前に確認）
    aliases: [wifi]
    cmds:
      - ./scripts/capture-wifi.sh

  setup:stackchan:
    desc: StackChan音声ファームの設定を対話で入力する（Wi-Fi/キー/予算/local/補完）
    cmds:
      - ./scripts/setup-wizard.sh stackchan

  setup:cardputer:
    desc: Cardputer(画面リンク)の設定を対話で入力する
    cmds:
      - ./scripts/setup-wizard.sh cardputer

  host:screen-link:setup:
    desc: host PCへ画面relayの固定版Python依存を導入する
    aliases: [host:setup]
    cmds:
      - uv sync --project pc/screen-link --frozen

  host:screen-link:run:
    desc: host PCでCardputer／StackChan向け画面relayを起動する
    aliases: [host:run]
    cmds:
      - ./pc/screen-link/run.sh

  host:screen-link:test:
    desc: host PCの画面relay単体テストを実行する
    aliases: [host:test]
    cmds:
      - uv run --project pc/screen-link --frozen python -m unittest discover -s pc/screen-link/tests -v

  host:screen-link:status:
    desc: host PCのrelayと接続端末数を確認する（URL=http://host:portで上書き）
    aliases: [host:status]
    vars:
      STATUS_URL: '{{.URL | default ""}}'
    env:
      SCREEN_LINK_STATUS_URL: "{{.STATUS_URL}}"
    cmds:
      - ./scripts/screen-link-status.sh

  host:stackchan:status:
    desc: host PCからrelayへ接続中のStackChan台数を確認する
    vars:
      STATUS_URL: '{{.URL | default ""}}'
    env:
      SCREEN_LINK_STATUS_URL: "{{.STATUS_URL}}"
    cmds:
      - ./scripts/screen-link-status.sh --target stackchan

  host:cardputer:status:
    desc: host PCからrelayへ接続中のCardputer台数を確認する
    vars:
      STATUS_URL: '{{.URL | default ""}}'
    env:
      SCREEN_LINK_STATUS_URL: "{{.STATUS_URL}}"
    cmds:
      - ./scripts/screen-link-status.sh --target cardputer

  m5burner:setup:
    desc: M5Burnerをダウンロードしてセットアップ・更新する（task m5burner:setup FORCE=1で再取得）
    aliases: [burner:setup]
    cmds:
      - ./scripts/setup-m5burner.sh {{if .FORCE}}--force{{end}}

  m5burner:run:
    desc: M5Burnerを起動する
    aliases: [burner, burner:run]
    cmds:
      - ./scripts/run-m5burner.sh

