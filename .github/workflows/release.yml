name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create release from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --title "$GITHUB_REF_NAME" \
            --notes '使い方: https://hjosugi.github.io/m5stack/ — build scriptは実機へ自動Flashしません。'
