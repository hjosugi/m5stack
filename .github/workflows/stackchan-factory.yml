name: StackChan factory source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackchan-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ESP-IDF build (no flash)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Install pinned ESP-IDF toolchain
        run: nix develop --command task stackchan:factory:setup
      - name: Test and build official source
        run: nix develop --command task stackchan:factory:build
      - name: Build Screen Link overlay with public CI values
        run: nix develop --command task stackchan:screen-link:ci
